name: Verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Proprietary-free verification
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run CI-safe verification
        shell: pwsh
        env:
          VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >
          ./tools/verify-ci.ps1
          -BaseSha $env:VERIFY_BASE_SHA
          -HeadSha $env:VERIFY_HEAD_SHA

      - name: Set up Python for offline-export safety tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test local HH-60 exporter guards (no game assets)
        run: |
          python -m pip install -r extras/hh60-visual/tools/requirements.txt
          python -m unittest discover -s extras/hh60-visual/tools -p "test_*.py"
